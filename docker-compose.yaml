services:
  frontend:
    build:
      context: ./frontend
      dockerfile: dockerfile.dev
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app #
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
    ports:
      - "5000:5000"
    environment:
      - DB_HOST=mysql
      - DB_USER=user
      - DB_PASSWORD=e
      - DB_NAME=mydb
      - PORT=5000
    depends_on:
      - mysql
    volumes:
      - ./backend:/app
      - /app/node_modules

  mysql:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: e
      MYSQL_DATABASE: mydb
      MYSQL_USER: user
      MYSQL_PASSWORD: e
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d

volumes:
  mysql-data:
